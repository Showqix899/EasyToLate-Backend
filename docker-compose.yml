version: "3.9"

services:

  app:
    build: .
    container_name: node_app
    restart: always
    ports:
      - "5000:5000"
    env_file:
      - .env
    depends_on:
      - redis
    volumes:
      - .:/app
      - /app/node_modules


  email_worker:
    build: .
    container_name: email_worker
    command: node src/worker/emailWorker.js
    env_file:
      - .env
    depends_on:
      - redis
    volumes:
      - .:/app
      - /app/node_modules


  place_image_worker:
    build: .
    container_name: place_image_worker
    command: node src/worker/placeImage.worker.js
    env_file:
      - .env
    depends_on:
      - redis
    volumes:
      - .:/app
      - /app/node_modules
  

  place_image_remover:
    build: .
    container_name: place_image_remover
    command: node src/worker/placeImageRemove.worker.js
    env_file:
     - .env
    depends_on:
     - redis
    volumes:
     - .:/app
     - /app/node_modules


  user_behavior_tracker:
    build: .
    container_name: user_behavior_tracker
    command: node src/worker/behaviourWorker.js
    env_file:
     - .env
    depends_on:
     - redis
    volumes:
     - .:/app
     - /app/node_modules


  redis:
    image: redis:7-alpine
    container_name: redis_server
    # ports:
    #   - "6379:6379"
